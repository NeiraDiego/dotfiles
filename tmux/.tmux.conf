
# ==========================================
# GENERAL
# ==========================================

# Recargar configuración: Prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display-message "Configuración recargada"

# Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:Smulx=\E[4::%p1%dm"
set -g extended-keys on
set -g extended-keys-format csi-u

# Mouse
set -g mouse on

# Numeración desde 1
set -g base-index 1
set -g pane-base-index 1

# Renumerar ventanas al cerrar alguna
set -g renumber-windows on

# Modo de selección estilo Vim
set -g mode-keys vi


# ==========================================
# VENTANAS
# ==========================================

# No permitir renombrado automático
set -wg automatic-rename off
set -wg allow-rename off

# Crear ventanas nuevas sin nombre
bind c new-window -n ""

# Renombrar manualmente: Prefix + ,
# (atajo predeterminado de tmux)

# Título de la terminal
set -g set-titles on
set -g set-titles-string "tmux: #S:#I"


# ==========================================
# PANELES
# ==========================================

# Navegación estilo Vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ==========================================
# APARIENCIA
# ==========================================

# Barra de estado arriba
set -g status-position top

# Catppuccin Mocha
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Mostrar número + nombre opcional
# Ejemplo: 1  |  2:Python  |  3:Odoo
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_number "#I"

set -g @catppuccin_window_text "#{?window_name,:#W,}"
set -g @catppuccin_window_current_text "#{?window_name,:#W,}"

# Barra de estado
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"


# ==========================================
# PLUGINS
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.0'


# ==========================================
# INICIALIZACIÓN TPM
# Siempre al final
# ==========================================

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
